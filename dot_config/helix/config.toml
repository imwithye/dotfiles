theme = "catppuccin_mocha"

[editor]
cursorline = true
color-modes = true
true-color = true
clipboard-provider = "termcode"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

[editor.indent-guides]
render = true

# Keep the internal yank register and also copy to the local terminal over SSH.
[keys.normal]
y = ["yank", "yank_to_clipboard"]

[keys.select]
y = ["yank", "yank_to_clipboard"]
